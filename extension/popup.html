<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status {
      font-size: 12px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      line-height: 1.4;
    }
    .status.success {
      border-color: #10b981;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
    }
    .status.error {
      border-color: #ef4444;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      margin-bottom: 6px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .token-box {
      width: 100%;
      box-sizing: border-box;
      height: 55px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #94a3b8;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      margin-bottom: 8px;
      resize: none;
    }
  </style>
</head>
<body>
  <h3>🚀 DeepSeek Extractor</h3>
  <div id="status" class="status">Memeriksa halaman chat.deepseek.com...</div>
  <textarea id="tokenBox" class="token-box" placeholder="userToken akan muncul di sini..." readonly></textarea>
  <button id="btnCopy" class="btn" style="display:none;">📋 Salin Token (Copy)</button>
  <button id="btnDownload" class="btn btn-secondary" style="display:none;">💾 Simpan ke .env</button>
  <script src="popup.js"></script>
</body>
</html>
