services:
  deepseek4free:
    build: .
    container_name: deepseek4free-router
    restart: unless-stopped
    ports:
      - "8990:8990"
    environment:
      - PORT=8990
      - HOST=0.0.0.0
    volumes:
      - ./.env:/app/.env:ro
      - ./tokens.txt:/app/tokens.txt
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8990/health"]
      interval: 30s
      timeout: 5s
      retries: 3
